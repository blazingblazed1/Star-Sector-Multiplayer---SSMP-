[package]
name = "ssmp-launcher"
version = "0.1.4"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.151"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
