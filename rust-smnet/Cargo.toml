[package]
name = "smnet"
version = "0.1.10"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
iroh = "1.3.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
wmi = "0.17"
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_System_Performance", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
